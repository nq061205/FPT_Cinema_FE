<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150">
  <!-- Nền tối sang trọng -->
  <rect width="400" height="150" fill="#1a1a1a" rx="15"/>
  
  <!-- Biểu tượng cuộn phim & Nút Play (Màu Cam FPT & Xanh lá) -->
  <circle cx="75" cy="75" r="40" fill="none" stroke="#F26522" stroke-width="6" stroke-dasharray="15, 5"/>
  <circle cx="75" cy="75" r="30" fill="none" stroke="#8DC63F" stroke-width="2"/>
  <polygon points="65,55 65,95 95,75" fill="#F26522"/>
  
  <!-- Chữ Logo -->
  <text x="135" y="85" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff">FPT</text>
  <text x="215" y="85" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="300" fill="#0072BC">Cinema</text>
  
  <!-- Slogan / Subtitle -->
  <text x="138" y="110" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#888888" letter-spacing="5">PREMIUM THEATER</text>
</svg>
